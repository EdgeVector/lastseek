[package]
name = "lastseek"
version = "0.1.0"
edition = "2021"
description = "LastSeek — memory-mapped semantic vector search for LastDB, outside Mini"
license = "MIT"

[dependencies]
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"

[features]
# Table-driven crash simulation for compact() (tests/store.rs). Never linked
# into a default build.
fault-injection = []

[profile.release]
opt-level = 3
lto = true
