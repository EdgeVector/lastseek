[package]
name = "lastseek"
version = "0.1.1"
edition = "2021"
description = "LastSeek — memory-mapped semantic vector search for LastDB, outside Mini"
license = "Apache-2.0"

# Without this, Cargo's implicit workspace would pull the vendored fastembed
# fork in as a member, so `cargo fmt --all` / `cargo clippy --all-targets
# --all-features -D warnings` would reformat and lint unmodified upstream
# code. Same exclusion fold uses for the same fork.
[workspace]
exclude = ["vendor/fastembed-4.9.0-no-image"]

[dependencies]
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
fs2 = "0.4"
# Neural embedding is opt-in (see `neural` feature below) so a default build
# links no inference runtime and downloads no model weights. Vendored at
# vendor/fastembed-4.9.0-no-image (same fork fold uses) so the pinned `ort`
# version it carries never collides with a second direct `ort` dependency in
# this crate's own graph. default-features = false + hf-hub left off: model
# bytes are read from disk ourselves (see BgeSmallEmbedder::load), never
# fetched from HuggingFace at build or run time.
fastembed = { path = "vendor/fastembed-4.9.0-no-image", optional = true, default-features = false, features = [
    "ort-download-binaries",
] }
# fastembed's vendored fork exact-pins `ort = "=2.0.0-rc.9"`, but ort-sys is
# a separate crate ort depends on with a looser range that a plain resolve
# floats up to a newer ort-sys (2.0.0-rc.13 as of 2026-08). That newer
# ort-sys build script requires a TLS feature rc.9's `ort` manifest has no
# way to request, so `download-binaries` fails to compile. Pinning ort-sys
# here too keeps the pair at the matching version fold's own lockfile uses.
ort-sys = { version = "=2.0.0-rc.9", optional = true, default-features = false }

[dev-dependencies]
tempfile = "3"

[features]
# Table-driven crash simulation for compact(). Never linked into a default
# build.
fault-injection = []
neural = ["dep:fastembed", "dep:ort-sys"]

[profile.release]
opt-level = 3
lto = true
