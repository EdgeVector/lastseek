# Merge gate and artifact publish for lastseek. Gate of record: GitHub (2026-09-30).
# `check` runs .lastgit/ci.sh: fmt, clippy and a build with the explicit feature set
# (no `neural`: no ONNX Runtime download, no model weights in CI). `ci-required`
# is the one required check. `publish` runs only on a push to main, after
# ci-required, and builds the feature-complete darwin-arm64 binary on a macOS runner.
name: ci-required

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Merge gate (.lastgit/ci.sh)
        env:
          NO_COLOR: "1"
        run: bash .lastgit/ci.sh

  ci-required:
    name: ci-required
    if: ${{ always() }}
    needs: [check]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every gate job to pass
        env:
          CHECK_RESULT: ${{ needs.check.result }}
        run: |
          echo "check=$CHECK_RESULT"
          test "$CHECK_RESULT" = "success"

  publish:
    name: publish
    needs: [ci-required]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    uses: EdgeVector/last-stack/.github/workflows/host-track-artifact.yml@main
    with:
      runs-on: macos-latest
      # cargo build --features neural (downloads ONNX Runtime binaries, never model
      # weights), then the release script's own smoke checks (--help, --version).
      build-command: "bash .lastgit/artifact-release.sh"
      config: .lastgit/artifacts.json
